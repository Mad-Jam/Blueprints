blueprint:
  name: Nordpool price cheap expensive (15-minute tariff)
  description: This blueprint uses the Nordpool integration with 15-minute tariffs. Select how many hours should be defined as expensive, and create automations based on that. You can use 15-minute increments (e.g., 2.5 for 2 hours and 30 minutes).
  domain: automation
  input:
    grid_area:
      name: Grid area sensor
      description: This is your Nordpool sensor that provides 15-minute price data.
      selector:
        entity:
          domain: sensor
          integration: nordpool
    expensive_hours:
      name: Expensive hours
      description: Select the total number of hours per day to be considered expensive. Allows for 15-minute increments (e.g., 1.25 = 1h 15m).
      default: 12
      selector:
        number:
          min: 0
          max: 24
          mode: slider
          step: 0.25
    expensive:
      name: Expensive
      description: Action to run during the most expensive periods.
      default: []
      selector:
        action: {}
    cheap:
      name: Cheap
      description: Action to run during the cheapest periods.
      default: []
      selector:
        action: {}
variables:
  grid_area_var: !input grid_area
  expensive_hours_input: !input expensive_hours
  expensive_periods_var: "{{ (expensive_hours_input | float(0) * 4) | int }}"

trigger:
  - platform: state
    entity_id: !input grid_area

action:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {# The logic now uses the correctly calculated 'expensive_periods_var' for comparison. #}
              {{ (state_attr(grid_area_var, 'today') | sort)[96 - expensive_periods_var] > states(grid_area_var) | float(0) }}
        sequence: !input cheap
      - conditions:
          - condition: template
            value_template: >-
              {{ (state_attr(grid_area_var, 'today') | sort)[96 - expensive_periods_var] < states(grid_area_var) | float(0) }}
        sequence: !input expensive
    default: []
